name: Generate Poster Screenshot

on:
  push:
    branches: ["develop", "main"]
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: main

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Debug Variable Presence
        run: |
          echo "Length of account ID variable: ${#VAR_CHECK}"
        env:
          VAR_CHECK: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Configure AWS credentials (via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GitHubActions_upcoming-gigs-image-generator
          aws-region: eu-west-2

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/cloudformation.yml \
            --stack-name upcoming-gigs-image-generator-${{ github.ref_name }} \
            --parameter-overrides \
              Environment=${{ github.ref_name }} \
            --capabilities CAPABILITY_NAMED_IAM

  screenshot:
    runs-on: ubuntu-latest
    needs: deploy
    environment: main

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (via OIDC)
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GitHubActions_upcoming-gigs-image-generator
          aws-region: eu-west-2

      - name: Get bucket name from CloudFormation
        id: cfn
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name upcoming-gigs-image-generator-${{ github.ref_name }} \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
            --output text)
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Fetch Google Business Reviews
        run: |
          echo "Exchanging Refresh Token for short-lived Access Token..."
          # Removed silent flag to catch any token generation errors
          TOKEN_RESPONSE=$(curl -X POST "https://oauth2.googleapis.com/token" \
            -d "client_id=${{ secrets.GOOGLE_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            -d "refresh_token=${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}" \
            -d "grant_type=refresh_token")

          ACCESS_TOKEN=$(echo $TOKEN_RESPONSE | jq -r '.access_token')

          # Failsafe: if the access token failed to generate, stop here and print why
          if [ "$ACCESS_TOKEN" = "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "Critical Error: Failed to generate access token!"
            echo "Google Response: $TOKEN_RESPONSE"
            exit 1
          fi

          echo "Fetching reviews from Google My Business API..."
          mkdir -p src/data

          # Added --fail, --show-error, and removed silent execution to pinpoint request errors
          curl --fail --show-error -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://mybusiness.googleapis.com/v4/accounts/${{ secrets.GOOGLE_ACCOUNT_ID }}/locations/${{ secrets.GOOGLE_LOCATION_ID }}/reviews" \
            > src/data/reviews.json
            
          echo "=== DEBUG: Review File Contents ==="
          cat src/data/reviews.json
          echo "==================================="

      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_API_KEY: ${{ secrets.VITE_GOOGLE_API_KEY }}

      - name: Start preview server
        run: npm run preview &

      - name: Wait for preview server
        run: npx wait-on http://localhost:4173 --timeout 30000

      # --- TAKE GIGS SCREENSHOT ---
      - name: Take Gigs Screenshot
        run: npm run screenshot
        env:
          CI: true
          SCREENSHOT_URL: http://localhost:4173
          SCREENSHOT_TYPE: gigs

      # --- TAKE REVIEWS SCREENSHOT ---
      - name: Take Review Screenshot
        run: npm run screenshot
        env:
          CI: true
          SCREENSHOT_URL: http://localhost:4173
          SCREENSHOT_TYPE: review

      # --- UPLOAD BOTH TO S3 ---
      - name: Upload posters to S3
        run: |
          aws s3 cp gigs-poster.png s3://${{ steps.cfn.outputs.bucket_name }}/gigs-poster.png
          aws s3 cp review-poster.png s3://${{ steps.cfn.outputs.bucket_name }}/review-poster.png
