name: Generate Poster Screenshot

on:
  push:
    branches: ["develop", "main"]
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 8am UTC
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::705892422439:role/GitHubActions_upcoming-gigs-image-generator
          aws-region: eu-west-2

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start preview server
        run: npm run preview &

      - name: Wait for preview server
        run: npx wait-on http://localhost:4173 --timeout 30000

      - name: Take screenshot
        run: npm run screenshot
        env:
          CI: true
          SCREENSHOT_URL: http://localhost:4173

      - name: Upload poster to S3
        run: aws s3 cp poster.png s3://upcoming-gigs-image-generator-${{ github.ref_name }}/poster.png
