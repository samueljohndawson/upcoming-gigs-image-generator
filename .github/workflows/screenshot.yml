name: Generate Poster Screenshot

on:
  push:
    branches: ["develop", "main"]
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 8am UTC
  workflow_dispatch:

jobs:

  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GitHubActions_upcoming-gigs-image-generator
          aws-region: eu-west-2

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/cloudformation.yml \
            --stack-name upcoming-gigs-image-generator-${{ github.ref_name }} \
            --parameter-overrides \
              Environment=${{ github.ref_name }} \
            --capabilities CAPABILITY_NAMED_IAM

  screenshot:
    runs-on: ubuntu-latest
    needs: deploy

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (via OIDC)
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GitHubActions_upcoming-gigs-image-generator
          aws-region: eu-west-2

      - name: Get bucket name from CloudFormation
        id: cfn
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name upcoming-gigs-image-generator-${{ github.ref_name }} \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
            --output text)
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_API_KEY: ${{ secrets.VITE_GOOGLE_API_KEY }}

      - name: Start preview server
        run: npm run preview &

      - name: Wait for preview server
        run: npx wait-on http://localhost:4173 --timeout 30000

      - name: Take screenshot
        run: npm run screenshot
        env:
          CI: true
          SCREENSHOT_URL: http://localhost:4173

      - name: Upload poster to S3
        run: aws s3 cp poster.png s3://${{ steps.cfn.outputs.bucket_name }}/poster.png
